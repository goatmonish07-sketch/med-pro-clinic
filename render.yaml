# Render blueprint — deploys the whole stack in one click.
#   API (Node) + managed PostgreSQL + static front end.
# Docs: https://render.com/docs/blueprint-spec
#
# After creating the blueprint, set the two `sync: false` vars in the dashboard:
#   - medpro-api  → CORS_ORIGIN  = your web URL (e.g. https://medpro-web.onrender.com)
#   - medpro-web  → VITE_API_URL = your api URL (e.g. https://medpro-api.onrender.com)

databases:
  - name: medpro-db
    databaseName: medpro
    user: medpro
    plan: free

services:
  # ---- REST API ----
  - type: web
    name: medpro-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medpro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false # set to your web app URL

  # ---- Front end (static) ----
  - type: web
    name: medpro-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false # set to your API URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
